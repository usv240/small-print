<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="486" viewBox="0 0 780 486" role="img" aria-labelledby="fig-cmdp-iris-title fig-cmdp-iris-desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="fig-cmdp-iris-title">Real people (Caltech CMDP): how much does iris size vary?</title>
<desc id="fig-cmdp-iris-desc">Histogram, measurement on a public dataset of 43 real people. Implied iris diameter 11.14 ± 0.56 mm (mean ± SD), range 10.11–12.36 mm, 10th–90th percentile 10.36–11.85 mm; published value 11.7 ± 0.5 mm. Bins of 0.25 mm: 10.00: 2, 10.25: 5, 10.50: 4, 10.75: 7, 11.00: 6, 11.25: 7, 11.50: 6, 11.75: 4, 12.00: 1, 12.25: 1.</desc>
<rect x="0.5" y="0.5" width="779" height="485" rx="14" fill="#ffffff" stroke="#e1e0d9"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#0b0b0b">Real people (Caltech CMDP): how much does iris size vary?</text>
<text x="24" y="55" font-size="12.5" fill="#52514e">From the app's iris landmarks, EXIF focal length and marked distance. SD 0.56 mm (5.0%) includes measurement error.</text>
<g aria-hidden="true"><rect x="522.8" y="20" width="233.20000000000002" height="22" rx="11" fill="#f0efec" stroke="#c3c2b7"/><text x="639.4" y="35" font-size="11" font-weight="600" fill="#52514e" text-anchor="middle" letter-spacing="0.6">REAL PEOPLE · PUBLIC DATASET</text></g>
