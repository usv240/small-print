<svg xmlns="http://www.w3.org/2000/svg" width="780" height="484" viewBox="0 0 780 484" role="img" aria-labelledby="fig-camera-linearity-title fig-camera-linearity-desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif">
<title id="fig-camera-linearity-title">Camera distance pipeline: linearity bench</title>
<desc id="fig-camera-linearity-desc">Two-panel chart, bench measurement. True 22.0 cm: measured 21.8 cm, error -1.10%, jitter SD 0.03%; True 25.0 cm: measured 25.1 cm, error +0.27%, jitter SD 0.05%; True 30.0 cm: measured 30.0 cm, error +0.00%, jitter SD 0.06% (calibration point); True 35.0 cm: measured 35.2 cm, error +0.52%, jitter SD 0.04%; True 40.0 cm: measured 40.1 cm, error +0.31%, jitter SD 0.03%; True 45.0 cm: measured 45.0 cm, error +0.06%, jitter SD 0.05%; True 50.0 cm: measured 50.3 cm, error +0.50%, jitter SD 0.04%; True 55.0 cm: measured 54.9 cm, error -0.16%, jitter SD 0.04%; True 60.0 cm: measured 60.0 cm, error -0.07%, jitter SD 0.03%; True 70.0 cm: measured 69.9 cm, error -0.09%, jitter SD 0.04%. Mean absolute error 0.34%, maximum 1.10%.</desc>
<rect x="0.5" y="0.5" width="779" height="483" rx="14" fill="#ffffff" stroke="#e1e0d9"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#0b0b0b">Camera distance pipeline: linearity bench</text>
<text x="24" y="55" font-size="12.5" fill="#52514e">A real face photo rescaled to simulate 22–70 cm, through the shipped MediaPipe pipeline in Chrome. Mean |error| 0.3%, max 1.1%.</text>
