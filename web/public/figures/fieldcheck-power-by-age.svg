<title id="fig-fieldcheck-power-title">Reading-glasses power by age: real programmes vs our simulation</title>
<desc id="fig-fieldcheck-power-desc">Two-panel line and dot chart comparing published field data with the simulation. 40–44: Kenya mean +1.50, India +1.21, simulated ideal at 40 cm +1.45, Small Print plus try-on +1.19; 45–49: Kenya mean +1.83, India +1.57, simulated ideal at 40 cm +1.47, Small Print plus try-on +1.31; 50–54: Kenya mean +2.19, India +2.05, simulated ideal at 40 cm +1.83, Small Print plus try-on +1.69; 55–59: Kenya mean +2.51, India +2.24, simulated ideal at 40 cm +2.35, Small Print plus try-on +2.19; 60–64: Kenya mean +2.81, India +2.58, simulated ideal at 40 cm +2.83, Small Print plus try-on +2.51; 65–69: Kenya mean +2.90, India +2.78, simulated ideal at 40 cm +2.87, Small Print plus try-on +2.55. Everyone, distance-corrected add: 41–45: Asmara +1.30, our population +0.08; 46–50: Asmara +1.77, our population +0.55; 51–55: Asmara +2.15, our population +1.30; 56–60: Asmara +2.37, our population +2.04.</desc>
