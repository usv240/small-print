<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>End card</title>
<style>
  :root { --bg: #fbf8f3; --surface: #fff; --ink: #1a1917; --muted: #5d5a55; --line: #e4ded4; --accent: #b4410e; --accent-soft: #fbe9df;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; --sans: "Segoe UI", system-ui, sans-serif; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 40px; }
  .brand { font: 700 84px var(--serif); margin: 0; letter-spacing: -.01em; }
  .brand span { color: var(--accent); }
  .rule { width: 90px; height: 4px; background: var(--accent); border-radius: 4px; margin: 22px 0 26px; }
  .tag { font: italic 500 40px/1.25 var(--serif); margin: 0 0 40px; }
  .url { font: 600 28px "Segoe UI", system-ui, sans-serif; color: var(--accent); background: var(--surface); border: 2px solid var(--accent); border-radius: 999px; padding: 12px 30px; margin: 0 0 30px; letter-spacing: .01em; }
  .fine { font: 20px/1.5 var(--sans); color: var(--muted); margin: 0; }
  .fine b { color: var(--ink); }
  .foot { position: absolute; bottom: 40px; left: 0; right: 0; text-align: center; font: 16px var(--sans); color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="brand" id="b">Small <span>Print</span></p>
    <div class="rule" id="r"></div>
    <p class="tag" id="t">Everyone deserves to read the small print.</p>
    <p class="url" id="u">dxug72099q2ay.cloudfront.net</p>
    <p class="fine" id="f">Free · two minutes · in the phone’s browser · no sign-up<br><b>Not an eye exam.</b> Helps you choose ready-made reading glasses.</p>
  </div>
  <p class="foot" id="ft">Built on AWS for the Zero to Shipped hackathon, 2026</p>
<script>
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const $ = (id) => document.getElementById(id);
  window.render = (t) => {
    const f = (a, d = 0.5) => clamp((t - a) / d);
    const up = (el, a) => { el.style.opacity = f(a); el.style.transform = `translateY(${(1 - f(a)) * 12}px)`; };
    up($('b'), 0.0); $('r').style.width = `${90 * f(0.3, 0.6)}px`; up($('t'), 2.0); up($('u'), 1.0); up($('f'), 1.3); $('ft').style.opacity = f(1.6);
  };
  window.render(0);
</script>
</body>
</html>
