<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>try{var t=localStorage.getItem('small-print.theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}document.documentElement.classList.add('js')</script>
  <title>Take the test · Small Print</title>
  <meta name="description" content="Two-minute reading glasses strength test using your phone camera. Free, private, not an eye exam.">
  <meta name="theme-color" content="#b4410e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <script type="module" src="/src/app.ts"></script>
  <script type="module" src="/src/ui/site.ts"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="site-header static">
    <div class="header-inner">
      <a class="brand" href="/"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="14.5" r="3.5"/><circle cx="17.5" cy="14.5" r="3.5"/><path d="M10 14c.7-.8 3.3-.8 4 0M3.2 13.4 5 7.5M20.8 13.4 19 7.5"/></svg>Small <span>Print</span></a>
      <nav class="site-nav" id="site-nav" aria-label="Site">
        <a href="/test.html" aria-current="page">Test</a>
        <a href="/how-it-works.html">How it works</a>
        <a href="/validation.html">Evidence</a>
        <a href="/impact.html">Impact</a>
        <a href="/judges.html">For judges</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode"><svg class="icon i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8 8 0 1 1 9.4 4a6.4 6.4 0 0 0 10.6 10.6z"/></svg><svg class="icon i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
        <button type="button" class="icon-btn menu-btn" aria-expanded="false" aria-controls="site-nav" aria-label="Menu"><svg class="icon i-menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><svg class="icon i-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </div>
  </header>
  <main class="app-main" id="app" tabindex="-1">
    <noscript><p>Small Print needs JavaScript to run the camera test. You can still read <a href="/how-it-works.html">how it works</a>.</p></noscript>
  </main>
  <video id="cam" playsinline muted aria-hidden="true"></video>
  <div class="demo-bar" id="demo-bar" hidden>
    <div class="wrap">
      <label for="demo-range"><span id="demo-label">Distance from your eyes</span><output id="demo-value">45 cm</output></label>
      <input type="range" id="demo-range" min="10" max="80" value="45" step="1">
      <p id="demo-note">Demo mode: the slider stands in for the camera.</p>
    </div>
  </div>
</body>
</html>
